<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ഓൺലൈൻ പഠന ക്ലാസ് (Multi-User Portal)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    nav {
      background: #1e293b;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    nav h1 {
      font-size: 1.25rem;
      color: #38bdf8;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .student-badge {
      background: #0369a1;
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .logout-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    /* Password Modal */
    #lockScreen {
      position: fixed;
      inset: 0;
      background: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .lock-box {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .lock-box h2 {
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .lock-box p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .lock-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 15px;
      outline: none;
      letter-spacing: 2px;
    }

    .lock-box button {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lock-box button:hover {
      background: #0369a1;
    }

    /* Main Container */
    .course-container {
      display: flex;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      gap: 20px;
    }

    /* Video Player */
    .video-area {
      flex: 2.3;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .custom-player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .video-responsive {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 ratio */
      height: 0;
    }

    .video-responsive iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none;
    }

    /* ക്ലിക്ക് ഷീൽഡ് */
    .video-click-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 50px);
      z-index: 10;
      cursor: pointer;
    }

    /* വാട്ടർമാർക്ക് (Student Name Overlay) */
    .watermark {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.4);
      color: rgba(255, 255, 255, 0.45);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      z-index: 15;
      pointer-events: none;
    }

    /* കൺട്രോളുകൾ */
    .custom-controls-bar {
      height: 50px;
      background: #111827;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 12px;
      z-index: 20;
      border-top: 1px solid #1f2937;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      color: #38bdf8;
      background: rgba(255, 255, 255, 0.08);
    }

    .time-text {
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: nowrap;
    }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: #374151;
      border-radius: 5px;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }

    .video-info {
      background: #1e293b;
      padding: 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .video-info h2 {
      font-size: 1.15rem;
      color: #f1f5f9;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      padding: 8px 15px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .nav-btn:hover:not(:disabled) {
      background: #0284c7;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Playlist */
    .playlist-area {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      max-height: 75vh;
    }

    .playlist-header {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .playlist-items {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
    }

    .lesson-item {
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .lesson-item:hover {
      background: #1e293b;
      border-color: #38bdf8;
    }

    .lesson-item.active {
      background: #0369a1;
      border-color: #38bdf8;
    }

    .lesson-num {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 7px;
      border-radius: 4px;
      font-weight: bold;
    }

    .lesson-title {
      font-size: 0.9rem;
      flex: 1;
    }

    @media (max-width: 900px) {
      .course-container {
        flex-direction: column;
      }
      .playlist-area {
        max-height: 400px;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- PIN ലോഗിൻ സ്ക്രീൻ -->
  <div id="lockScreen">
    <div class="lock-box">
      <h2>🔐 വിദ്യാർത്ഥി ലോഗിൻ</h2>
      <p>ക്ലാസിൽ ചേരുമ്പോൾ നൽകിയ രഹസ്യ PIN നൽകുക</p>
      <input type="text" id="passInput" placeholder="PIN ഇവിടെ ടൈപ്പ് ചെയ്യുക" autocomplete="off" />
      <button onclick="checkAccess()">പ്രവേശിക്കുക</button>
      <p id="errText" style="color: #f87171; font-size: 0.85rem; margin-top: 10px; display: none;">ഈ PIN ശരിയല്ല! വീണ്ടും പരിശോധിക്കുക.</p>
    </div>
  </div>

  <!-- Header -->
  <nav>
    <h1>🎓 ഓൺലൈൻ ക്ലാസ്സ് റൂം</h1>
    <div class="nav-user">
      <span class="student-badge" id="studentBadge">വിദ്യാർത്ഥി: -</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="course-container">
    <div class="video-area">
      <!-- Player Wrapper -->
      <div class="custom-player-wrapper" id="playerWrapper">
        <div class="video-responsive">
          <div id="ytIframe"></div>
        </div>

        <!-- വീഡിയോ സ്ക്രീൻ റെക്കോർഡ് ചെയ്യാതിരിക്കാൻ പേര് കാണിക്കുന്ന ഭാഗം -->
        <div class="watermark" id="watermark">വിദ്യാർത്ഥി</div>

        <!-- യൂട്യൂബിലേക്ക് പോകാതിരിക്കാനുള്ള ഷീൽഡ് -->
        <div class="video-click-shield" onclick="togglePlay()"></div>

        <!-- കൺട്രോളുകൾ -->
        <div class="custom-controls-bar">
          <button class="ctrl-btn" id="playBtn" onclick="togglePlay()">▶</button>
          <span class="time-text" id="timeDisplay">00:00 / 00:00</span>
          <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0" oninput="seekVideo(this.value)">
          <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
          <button class="ctrl-btn" onclick="toggleFullScreen()">⛶</button>
        </div>
      </div>

      <div class="video-info">
        <h2 id="currentTitle">ക്ലാസ് വിവരങ്ങൾ ലോഡ് ചെയ്യുന്നു...</h2>
        <div class="nav-buttons">
          <button id="prevBtn" class="nav-btn" onclick="prevClass()">◀ മുൻപത്തെ ക്ലാസ്</button>
          <button id="nextBtn" class="nav-btn" onclick="nextClass()">അടുത്ത ക്ലാസ് ▶</button>
        </div>
      </div>
    </div>

    <!-- Playlist -->
    <div class="playlist-area">
      <div class="playlist-header">പാഠഭാഗങ്ങൾ</div>
      <div class="playlist-items" id="playlist"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // ==============================================================
    // 1. വിദ്യാർത്ഥികളുടെ പേരും അവർക്കുള്ള വ്യത്യസ്ത PIN നമ്പറുകളും
    // ==============================================================
    const studentList = [
      { name: "Ajmal Thasleeque. k", pin: "EH2822" },
      { name: "Ramanathan. T. K.", pin: "EH6061" },
      { name: "Basheer bakavi. ", pin: "EH7766" },
      { name: "Faseenasudheer", pin: "EH6109" },
      { name: "ramisakutty", pin: "EH9600" },
      { name: "yoonas ali A ", pin: "EH7396" },
      { name: "Ashir", pin: "EH0715" },
      { name: "Abdul Nasar", pin: "EH4040" },
      { name: "അർജുൻ വി.", pin: "ARJ909" },
      { name: "റോഹൻ ദാസ്", pin: "ROH111" }
      // പുതിയ കുട്ടികളെ ചേർക്കാൻ: { name: "പേര്", pin: "PIN" }, എന്ന രൂപത്തിൽ ചേർക്കുക
    ];

    // ==============================================================
    // 2. നിങ്ങളുടെ 10 വീഡിയോകളുടെ YouTube Video ID
    // ==============================================================
    const classList = [
       { id: "YyA-EMVV7n0", title: "CLASS 1: Electro Homeo Class indroduction" },
      { id: "Gy00rUljU7o", title: "CLASS 2: Electro Homeo Class Medicines 1" },
      { id: "woJ832Gz1oU", title: "CLASS 3: Electro Homeo Class Medicines 2" },
      { id: "WZkvNDKEe-w", title: "CLASS 4: Electro Homeo Class Medicines 3" },
      { id: "Iv3xBKqVmvo", title: "CLASS 5: Electro Homeo Class scrofoloso Groop" },
      { id: "hSrVWHV8GWI", title: "CLASS 6: Electro Homeo Class Canceroso Groop" },
      { id: "rlAVZrM2DUo", title: "CLASS 7: Electro Homeo Class Angiotico & Febrifugo" },
      { id: "7sUXhrnD0Is", title: "CLASS 8: Electro Homeo Class Pettolale Groop" },
      { id: "-kJ4lY6d9l4", title: "CLASS 9: Electro Homeo Class VER,VEN,APP & Limphatico" },
      { id: "x3bSYYmDkBY", title: "CLASS 10:Electro Homeo Class Electricity Medicines" },
      { id: "pEe8Z-FF8yo", title: "CLASS 11: Electro Homeo Class Dedeases& Medicines" },
      { id: "eVTXPUF4Oz4", title: "CLASS 12: Electro Homeo Class Dedeases& Medicines" }
    ];

    let player;
    let currentIndex = 0;
    let isApiReady = false;
    let updateTimer = null;

    function onYouTubeIframeAPIReady() {
      isApiReady = true;
    }

    // ലോഗിൻ പരിശോധന (ഓരോരുത്തരുടെയും PIN പരിശോധിക്കുന്നു)
    function checkAccess() {
      const enteredPin = document.getElementById("passInput").value.trim().toUpperCase();
      const errText = document.getElementById("errText");

      // നൽകിയ PIN ലിസ്റ്റിൽ ഉണ്ടോ എന്ന് പരിശോധിക്കുന്നു
      const student = studentList.find(s => s.pin.toUpperCase() === enteredPin);

      if (student) {
        // ശരിയായ PIN ആണെങ്കിൽ
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("studentBadge").innerText = `വിദ്യാർത്ഥി: ${student.name}`;
        document.getElementById("watermark").innerText = `${student.name} (${student.pin})`;
        
        sessionStorage.setItem("loggedInStudent", JSON.stringify(student));
        loadClass(0);
      } else {
        errText.style.display = "block";
      }
    }

    function logout() {
      sessionStorage.removeItem("loggedInStudent");
      location.reload();
    }

    function initPlayer(videoId) {
      if (player) {
        player.loadVideoById(videoId);
        return;
      }

      player = new YT.Player('ytIframe', {
        videoId: videoId,
        playerVars: {
          controls: 0,
          disablekb: 1,
          modestbranding: 1,
          rel: 0,
          fs: 0
        },
        events: {
          'onReady': () => {
            updateTimer = setInterval(updateProgress, 500);
          },
          'onStateChange': (e) => {
            document.getElementById("playBtn").innerText = (e.data === YT.PlayerState.PLAYING) ? "⏸" : "▶";
          }
        }
      });
    }

    function togglePlay() {
      if (!player) return;
      (player.getPlayerState() === YT.PlayerState.PLAYING) ? player.pauseVideo() : player.playVideo();
    }

    function toggleMute() {
      if (!player) return;
      const muteBtn = document.getElementById("muteBtn");
      if (player.isMuted()) {
        player.unMute();
        muteBtn.innerText = "🔊";
      } else {
        player.mute();
        muteBtn.innerText = "🔇";
      }
    }

    function seekVideo(val) {
      if (!player) return;
      player.seekTo((val / 100) * player.getDuration(), true);
    }

    function updateProgress() {
      if (!player || typeof player.getCurrentTime !== 'function') return;
      const current = player.getCurrentTime() || 0;
      const duration = player.getDuration() || 0;

      if (duration > 0) {
        document.getElementById("progressBar").value = (current / duration) * 100;
        document.getElementById("timeDisplay").innerText = `${formatTime(current)} / ${formatTime(duration)}`;
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function toggleFullScreen() {
      const wrapper = document.getElementById("playerWrapper");
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().catch(err => alert("Error: " + err.message));
      } else {
        document.exitFullscreen();
      }
    }

    function renderPlaylist() {
      const playlistEl = document.getElementById("playlist");
      playlistEl.innerHTML = "";

      classList.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = `lesson-item ${index === currentIndex ? 'active' : ''}`;
        div.onclick = () => loadClass(index);

        div.innerHTML = `
          <span class="lesson-num">${index + 1}</span>
          <span class="lesson-title">${item.title}</span>
        `;
        playlistEl.appendChild(div);
      });
    }

    function loadClass(index) {
      currentIndex = index;
      const video = classList[index];

      document.getElementById("currentTitle").innerText = video.title;
      document.getElementById("prevBtn").disabled = (currentIndex === 0);
      document.getElementById("nextBtn").disabled = (currentIndex === classList.length - 1);

      if (isApiReady) {
        initPlayer(video.id);
      } else {
        setTimeout(() => loadClass(index), 300);
      }

      renderPlaylist();
    }

    function nextClass() {
      if (currentIndex < classList.length - 1) loadClass(currentIndex + 1);
    }

    function prevClass() {
      if (currentIndex > 0) loadClass(currentIndex - 1);
    }

    document.getElementById("passInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkAccess();
    });

    // നേരത്തെ ലോഗിൻ ചെയ്തിട്ടുണ്ടെങ്കിൽ നേരിട്ട് തുറക്കുന്നു
    const savedStudent = sessionStorage.getItem("loggedInStudent");
    if (savedStudent) {
      const student = JSON.parse(savedStudent);
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("studentBadge").innerText = `വിദ്യാർത്ഥി: ${student.name}`;
      document.getElementById("watermark").innerText = `${student.name} (${student.pin})`;
      loadClass(0);
    }

    renderPlaylist();
  </script>
</body>
</html>
